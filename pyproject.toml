[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosacd"
version = "0.1.0"
description = "MosaCD: conditional-independence-guided LLM causal discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "networkx>=3.2,<4",
    "openai>=1.40,<3",
    "pgmpy @ git+https://github.com/pgmpy/pgmpy.git@8f75787e3a22e14daa8cebc676e7577492c85935",
]

[project.scripts]
mosacd = "mosacd.cli:main"

[tool.setuptools.packages.find]
include = ["mosacd*"]
